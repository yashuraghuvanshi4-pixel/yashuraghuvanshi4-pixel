<svg xmlns="http://www.w3.org/2000/svg" width="450" height="195" viewBox="0 0 450 195" fill="none">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00ff66; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .stat-bold { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .stat-green { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00ff66; filter: drop-shadow(0 0 4px rgba(0,255,102,0.4)); }
    .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00ff66; }
    .border-card { stroke: #30363d; stroke-width: 1; rx: 10; fill: #0d1117; }
    .circle-bg { stroke: #21262d; stroke-width: 5; fill: none; }
    .circle-glow { stroke: #00ff66; stroke-width: 5; fill: none; stroke-linecap: round; stroke-dasharray: 250; stroke-dashoffset: 25; filter: drop-shadow(0 0 6px #00ff66); }
  </style>

  <rect x="0.5" y="0.5" width="449" height="194" class="border-card" />

  <!-- Header -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Yash pal Singh's GitHub Stats</text>
  </g>

  <!-- Left Stats List -->
  <g transform="translate(25, 65)">
    <!-- Stars -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#e3b341" />
      <text x="20" y="10" class="stat">Total Stars Earned:</text>
      <text x="220" y="10" class="stat-bold">8</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="3" fill="#00ff66" />
      <text x="20" y="10" class="stat">Total Commits:</text>
      <text x="220" y="10" class="stat-green">400</text>
    </g>

    <!-- Repositories -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="3" fill="#39d353" />
      <text x="20" y="10" class="stat">Public &amp; Core Repos:</text>
      <text x="220" y="10" class="stat-bold">25</text>
    </g>

    <!-- Longest Streak -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="6" r="3" fill="#00ff66" />
      <text x="20" y="10" class="stat">Longest Streak:</text>
      <text x="220" y="10" class="stat-green">90 Days</text>
    </g>
  </g>

  <!-- Right Rank Badge -->
  <g transform="translate(365, 110)">
    <circle cx="0" cy="0" r="42" class="circle-bg" />
    <circle cx="0" cy="0" r="42" class="circle-glow" />
    <text x="0" y="8" text-anchor="middle" class="rank-text">A+</text>
  </g>
</svg>
